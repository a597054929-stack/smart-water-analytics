version: "3.9"

services:
  agent:
    build: .
    container_name: water-agent
    ports:
      - "8000:8000"
    # Soft reference — if .env is missing, the container still starts
    # but LLM calls will fail. That's fine for browsing the UI.
    env_file:
      - .env
    volumes:
      - .:/app
      # Persist generated data so it survives container restarts.
      - data:/app/backend/data/output
    # Override the Dockerfile CMD to ensure live-reload of code changes
    # mounted via the volume above.
    command: python agent/server.py

  dashboard:
    image: node:20-slim
    container_name: water-dashboard
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep node_modules inside the container, not on the host.
      - /app/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             node frontend/build.cjs &&
             npx --yes serve frontend/dist -l 5173"

volumes:
  data:
