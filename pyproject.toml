[project]
name = "smart-water-analytics"
version = "1.0.0"
description = "Production-grade data pipeline + AI agent for Macau water utility (9,963 meters, anomaly detection, prediction, LangChain agent)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "李志泉", email = "[email protected]" },
]
keywords = ["data-engineering", "mlops", "anomaly-detection", "langchain", "water-utility"]

# Runtime dependencies — versions floored, pinned in requirements.lock.txt for CI
dependencies = [
    # LangChain core
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.4.0",
    # Web server
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    # ML
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    # MLOps
    "pandera>=0.20.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Repository = "https://github.com/zhiquan-liu/smart-water-analytics"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "pipeline", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "backend/data/",
    "frontend/dist/",
    "frontend/node_modules/",
    "*.egg-info/",
    "build/",
    ".venv/",
]

[tool.ruff.lint]
# Rule sets: E/F (pycodestyle/pyflakes), W (warnings), I (isort), UP (pyupgrade), B (bugbear)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line-too-long (let formatter handle)
    "B008",  # function-call-in-default-arg (FastAPI pattern)
    "E402",  # module-import-not-at-top (intentional late imports for error handling)
    "B905",  # zip-without-explicit-strict (predates 3.10 in legacy code)
    "E702",  # multiple-statements-on-one-line (acceptable in scripts)
    "E741",  # ambiguous-variable-name (l, O, I in code)
    "B007",  # unused-loop-control-variable (often intentional `for i, _ in`)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F401", "F841"]  # test imports/vars often intentionally unused
"agent/server.py" = ["F401"]  # late imports + optional type imports
"scripts/*" = ["F401", "F841"]  # scripts often have CLI placeholder vars

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "live: tests that call real LLM (set RUN_LIVE=1 to enable)",
    "slow: tests that take >5s",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langchain.*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing — many files are still untyped
ignore_missing_imports = true
exclude = [
    "backend/data/",
    "frontend/",
    "build/",
]
