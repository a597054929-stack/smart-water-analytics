name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate mock data
        # Tests read from backend/data/output/, which is gitignored.
        # Must run before pytest.
        run: python scripts/mock_data_generator.py

      - name: Run tests
        # No LLM key required: the test suite calls agent tools directly,
        # never through the LLM. Safe to run on public CI runners.
        run: pytest tests/ -v --tb=short
